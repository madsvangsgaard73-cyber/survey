<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* VOICE  field notebook for surveying: short, precise, usable with cold fingers
   IDEA   a surveyor's field book: numbered items, big numbers, red signal colour for "waiting"
   PICTURE the active measurement is the picture: big number on top, rows that fill up
   COLOUR white/black, signal red #e4002b, one grey; night #0e0e0e
   TYPE   Archivo wide 800 for numbers and titles, Archivo for text; LAYOUT one column, fixed tabs at the bottom */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e0e);--ink:light-dark(#111,#f1f1f1);--mut:light-dark(#666,#a3a3a3);--line:light-dark(#d9d9d9,#2c2c2c);--soft:light-dark(#f3f3f3,#1a1a1a);--red:#e4002b;--ok:light-dark(#0a7a3d,#5cd08f);--warn:light-dark(#9a6200,#f0b44c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;padding-bottom:76px}
h1,h2,h3{font-stretch:112%;font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:20px}h2{font-size:26px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:44px;padding:0 14px;border:2px solid var(--ink);background:var(--bg);border-radius:0;font-weight:700;cursor:pointer}
button.pri{background:var(--ink);color:var(--bg)}
button.red{background:var(--red);border-color:var(--red);color:#fff}
button.ghost{border-color:var(--line)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:1px}
input,select,textarea{min-height:44px;border:1.5px solid var(--line);background:var(--bg);padding:8px 10px;font-size:16px;width:100%;border-radius:0}
textarea{min-height:88px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--ink)}
header.top .wrap{display:flex;gap:10px;align-items:center;min-height:58px}
.brand{flex:1;line-height:1.15}
.brand small{display:block;color:var(--mut);font-size:13px}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--line);padding:4px 10px;min-height:44px;background:var(--bg);cursor:pointer}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.chip.on .dot{background:var(--ok)}.chip.busy .dot{background:var(--warn)}.chip.sim .dot{background:var(--red)}
.chip b{font-stretch:112%;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--bg);border-top:3px solid var(--ink);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{border:0;min-height:62px;font-size:14px;font-weight:700;color:var(--mut)}
nav.tabs button[aria-current=page]{color:var(--ink);box-shadow:inset 0 4px 0 var(--red)}
main{padding:16px 0 24px}
.lead{color:var(--mut);margin:6px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:14px 0}
.stats div{padding:8px 4px}.stats b{display:block;font-size:26px;font-stretch:112%;font-weight:800;font-variant-numeric:tabular-nums}.stats span{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:2px solid var(--ink)}
.seg button{border:0;flex:1;min-width:0;padding:0 8px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.group{margin:18px 0 6px;font-size:13px;font-weight:800;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:4px}
.card{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:12px 0;background:none;font-weight:400;min-height:0}
.card .id{font-stretch:112%;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.card .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.card .m{grid-column:2;font-size:13px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:1px 6px;border:1.5px solid currentColor;white-space:nowrap}
.b-open{color:var(--mut)}.b-partial{color:var(--warn)}.b-done{color:var(--ok)}.b-conf{color:var(--red)}
.box{border:1.5px solid var(--line);padding:12px;margin:12px 0}
.box.red{border-color:var(--red)}
.why{white-space:pre-wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.mrow{border:2px solid var(--line);padding:10px;margin:10px 0;position:relative}
.mrow.armed{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.mrow .lab{font-weight:700}
.mrow .sub{font-size:13px;color:var(--mut)}
.mval{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;margin-top:8px}
.mval input{font-size:24px;font-stretch:112%;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;min-height:52px}
.mval .u{font-weight:700;min-width:2em}
.mmeta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 6.5em auto;gap:6px;margin-top:6px}
.mmeta input{min-height:40px;font-size:14px;text-align:right}
.mmeta input.miss{border-color:var(--warn)}
.mmeta select,.mmeta button{min-height:40px;font-size:14px}
.waiting{position:absolute;top:-11px;right:8px;background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:1px 8px}
.delta{font-size:13px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:8px}
.photos button{padding:0;border:0;aspect-ratio:1;overflow:hidden;background:var(--soft);min-height:0}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos button{position:relative}.photos .tag{position:absolute;left:0;right:0;bottom:0;font-size:11px;line-height:1.3;background:rgba(0,0,0,.62);color:#fff;padding:2px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam{position:relative;margin:10px 0;background:#000;aspect-ratio:16/9;overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .camst{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:13px;color:#fff;background:rgba(0,0,0,.55)}.cam .camst b{color:#7CFC8A}
.phwrap{position:relative}.phwrap img{display:block;width:100%}.ring{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border:2px solid #7CFC8A;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.6);pointer-events:none}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:2px solid var(--ink);font-weight:700;cursor:pointer}
.filebtn.pri{background:var(--ink);color:var(--bg)}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.big{font-size:clamp(44px,14vw,84px);font-stretch:125%;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.log{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:8px;max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--mut)}
.chk{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center;margin-top:12px;min-height:44px}
.chk input{width:22px;height:22px;min-height:0;margin:0}
.warnbox{border-left:6px solid var(--red);background:var(--soft);padding:10px 12px;margin:12px 0}
.list-plain{list-style:none;padding:0;margin:0}
.list-plain li{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.list-plain li .grow{flex:1;min-width:160px}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0/.5);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .in{background:var(--bg);width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:16px;border-top:4px solid var(--red)}
.sheet img{width:100%;height:auto;display:block;background:var(--soft)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;font-weight:700;z-index:30;max-width:92vw;display:none}
.toast.show{display:block}
.navrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:18px}
@media (prefers-reduced-motion:no-preference){.mrow.armed{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 5px rgb(228 0 43/.25)}}}
@media (max-width:420px){.stats b{font-size:22px}.card{grid-template-columns:64px minmax(0,1fr)}}
</style>
</head>

e window to the north-west (laundry) and two light wells to the south-east. Create one item per window with the distance from the nearest corner.","locator":{"level":"Basement"},"photos_wanted":1,"measurements":[{"key":"from_corner","label":"Nearest corner to window edge","unit":"m"},{"key":"width","label":"Opening width","unit":"m"},{"key":"height","label":"Opening height","unit":"m","model_value":0.5,"model_status":"extracted","model_source":"Section 1954"},{"key":"sill","label":"Floor to bottom of opening","unit":"m","model_value":1.7,"model_status":"extracted","model_source":"Section 1954"},{"key":"wall","label":"Wall thickness at the opening","unit":"mm","model_value":310,"model_status":"extracted","model_source":"Specification 1954: 31 cm concrete"}]},{"id":"H-008","title":"Check the meter against a tape measure","why":"The same three distances with laser and with tape. Shows the meter reference (rear/front edge) and whether we can trust it.","locator":{"level":"Basement"},"measurements":[{"key":"k1_laser","label":"Short distance (approx. 1 m) – laser","unit":"m"},{"key":"k1_tape","label":"Short distance – tape","unit":"m"},{"key":"k2_laser","label":"Medium distance (approx. 3 m) – laser","unit":"m"},{"key":"k2_tape","label":"Medium distance – tape","unit":"m"},{"key":"k3_laser","label":"Long distance (laundry diagonal) – laser","unit":"m"},{"key":"k3_tape","label":"Long distance – tape","unit":"m"}]},{"id":"H-009","title":"Photo series for 3D trial","why":"Choose an object with known dimensions (e.g. a bookcase). Take 20–40 overlapping photos all the way round, and measure one edge with the laser as scale.","locator":{"level":"Basement"},"photos_wanted":20,"measurements":[{"key":"scale","label":"Known edge (scale)","unit":"m"}]}],"tolerance_mm":20}</script>

const APP_VERSION = '0.3.1';
const BOSCH = { svc: '02a6c0d0-0451-4000-b000-fb3210111989', chr: '02a6c0d1-0451-4000-b000-fb3210111989', sync: [0xC0, 0x55, 0x02, 0x01, 0x00, 0x1A] };
const METHODS = [['laser-ble','Laser (Bluetooth)'],['laser-manual','Laser, read off'],['tape','Tape measure'],['folding-rule','Folding rule'],['estimate','Estimate'],['other','Other']];
const UNITS = ['m','mm','deg','pcs','text'];
const UNIT_LABEL = { m:'m', mm:'mm', deg:'°', pcs:'pcs', text:'' };
const STATE_LABEL = { open:'Open', partial:'Partial', done:'Done' };
const REFS = [['rear','Rear edge'],['front','Front edge'],['tripod','Tripod thread'],['unknown','Unknown']];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowIso = () => new Date().toISOString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const isLen = u => u === 'm' || u === 'mm';
const hex = u8 => Array.from(u8, b => b.toString(16).padStart(2, '0')).join(' ').toUpperCase();
function fmtNum(v, unit) {
  if (v === '' || v === null || v === undefined) return '';
  if (typeof v !== 'number') return String(v);
  const d = unit === 'm' ? 3 : unit === 'mm' ? 0 : unit === 'deg' ? 1 : unit === 'pcs' ? 0 : 3;
  return v.toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: unit === 'm' ? 4 : d + 1, useGrouping: false });

  const t = String(s).trim().replace(/\s/g, '').replace(',', '.');

  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return s + ' s ago';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  return Math.round(s / 3600) + ' h ago';
}

/* ---------- storage (IndexedDB with in-memory fallback) ---------- */
const STORES = ['packages', 'results', 'photos', 'kv'];
const DB = { db: null, mem: Object.fromEntries(STORES.map(n => [n, new Map()])) };
function idbOpen() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('survey', 1);
      r.onupgradeneeded = () => STORES.forEach(n => r.result.createObjectStore(n));
      r.onsuccess = () => { DB.db = r.result; res(true); };
      r.onerror = () => res(false);
      r.onblocked = () => res(false);
    } catch (e) { res(false); }
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    try {
      const t = DB.db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r ? r.result : undefined);
      t.onerror = () => rej(t.error);
    } catch (e) { rej(e); }
  });

async function dbPut(store, key, val) { DB.mem[store].set(key, val); if (DB.db) { try { await tx(store, 'readwrite', s => s.put(val, key)); } catch (e) { warnStorage(e); } } }
async function dbGet(store, key) { if (DB.db) { try { const v = await tx(store, 'readonly', s => s.get(key)); if (v !== undefined) return v; } catch (e) {} } return DB.mem[store].get(key); }
async function dbDel(store, key) { DB.mem[store].delete(key); if (DB.db) { try { await tx(store, 'readwrite', s => s.delete(key)); } catch (e) {} } }
async function dbKeys(store) { if (DB.db) { try { return await tx(store, 'readonly', s => s.getAllKeys()); } catch (e) {} } return [...DB.mem[store].keys()]; }
let storageWarned = false;
function warnStorage(e) { if (!storageWarned) { storageWarned = true; toast('Could not save on the phone – export often'); } }

/* ---------- state ---------- */
const S = {
  builtin: {}, pkgs: {}, active: null, res: null,
  tab: 'list', itemId: null, filter: 'open', q: '', armed: null,
  last: null,
  settings: { surveyor: '', meterRef: 'rear', photoMax: 2048, keepAlive: true, showHeartbeat: false, heightDefault: '', camOnReading: false, laserColor: 'green' },
  meter: { state: 'off', dev: null, chr: null, want: false, sim: false, log: [], timer: null, bound: new WeakSet() },
  thumbs: new Map(), downloads: null

function pkg() { return S.pkgs[S.active] || null; }
function allItems() { const p = pkg(); if (!p) return []; return [...p.items, ...(S.res?.new_items || [])]; }
function itemById(id) { return allItems().find(i => i.id === id); }
function entry(id, create) {
  if (!S.res) return null;
  let e = S.res.entries[id];
  if (!e && create) e = S.res.entries[id] = { state: null, note: '', locator: {}, measurements: [], photos: [], updated: nowIso() };

}
function stateOf(item) { const e = S.res?.entries[item.id]; return (e && e.state) || item.state || 'open'; }
function locOf(item) { const e = S.res?.entries[item.id]; return Object.assign({}, item.locator || {}, e?.locator || {}); }
async function saveRes() { if (!S.res) return; S.res.updated = nowIso(); await dbPut('results', S.res.package_id, S.res); }
async function saveSettings() { await dbPut('kv', 'settings', S.settings); }

function newResult(p) { return { package_id: p.package_id, package_version: p.version || '', entries: {}, new_items: [], created: nowIso(), updated: nowIso() }; }
async function activate(id) {
  if (!S.pkgs[id]) return;
  S.active = id;
  S.res = (await dbGet('results', id)) || newResult(S.pkgs[id]);
  S.itemId = null; S.armed = null;
  await dbPut('kv', 'active', id);
  render();
}

/* ---------- views ---------- */
const view = $('#view');
function setTab(t) { S.tab = t; if (t !== 'item') { S.armed = null; camStop(); } render(); window.scrollTo(0, 0); }
function render() {
  const p = pkg();
  $('#hdrObj').textContent = p ? p.object.name + ' · ' + p.package_id : 'No package selected';
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', (b.dataset.tab === S.tab || (S.tab === 'item' && b.dataset.tab === 'list')) ? 'page' : 'false'));
  renderChip();
  if (!p && S.tab !== 'pkgs' && S.tab !== 'meter') { S.tab = 'pkgs'; }
  ({ list: renderList, item: renderItem, meter: renderMeter, pkgs: renderPkgs, export: renderExport })[S.tab]();
}

function renderChip() {
  const c = $('#chip'), m = S.meter;
  c.className = 'chip' + (m.state === 'on' ? ' on' : m.state === 'connecting' || m.state === 'reconnecting' ? ' busy' : m.sim ? ' sim' : '');
  $('#chipVal').textContent = S.last ? fmtNum(S.last.m, 'm') + ' m' : (m.state === 'on' ? 'Ready' : m.sim ? 'Simulator' : 'Meter');
  c.title = S.last ? ago(S.last.t) : '';
}

function counts() {
  const items = allItems();
  let open = 0, partial = 0, done = 0, meas = 0, photos = 0;
  for (const i of items) {
    const st = stateOf(i); if (st === 'done') done++; else if (st === 'partial') partial++; else open++;
    const e = S.res?.entries[i.id]; if (e) { meas += e.measurements.filter(m => m.value !== '' && m.value !== null).length; photos += e.photos.length; }
  }
  return { open, partial, done, meas, photos, total: items.length };
}

function renderList() {
  const p = pkg(); const c = counts();
  const q = S.q.trim().toLowerCase();
  let items = allItems().filter(i => {
    const st = stateOf(i);
    if (S.filter === 'open' && st === 'done') return false;
    if (S.filter === 'done' && st !== 'done') return false;
    if (q && !(i.id + ' ' + i.title + ' ' + (i.why || '') + ' ' + Object.values(locOf(i)).join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
  const g = p.group_by;
  let html = `<h2>${esc(p.object.name)}</h2>
  <p class="lead">Origin: <b>${esc(p.reference.origin.name)}</b>${p.reference.origin.description ? ' – ' + esc(p.reference.origin.description) : ''}</p>
  <div class="stats"><div><b>${c.open}</b><span>open</span></div><div><b>${c.partial}</b><span>partial</span></div><div><b>${c.meas}</b><span>meas.</span></div><div><b>${c.photos}</b><span>photos</span></div></div>
  <div class="row"><input id="q" type="search" placeholder="Search items" value="${esc(S.q)}" style="flex:1;min-width:160px" aria-label="Search">

  <div class="seg" style="margin-top:8px">${[['open','Open'],['all','All'],['done','Done']].map(([k, l]) => `<button data-f="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join('')}</div>`;
  if (!items.length) html += `<p class="lead" style="margin-top:18px">No items here. Change the filter or create a new item.</p>`;
  let lastGroup = null;
  for (const i of items) {
    if (g) { const gv = locOf(i)[g] || 'No ' + g; if (gv !== lastGroup) { html += `<div class="group">${esc(gv)}</div>`; lastGroup = gv; } }
    const st = stateOf(i), e = S.res.entries[i.id], loc = locOf(i);
    const nm = e ? e.measurements.filter(m => m.value !== '' && m.value !== null).length : 0, np = e ? e.photos.length : 0;
    const planned = (i.measurements || []).length;
    html += `<button class="card" data-item="${esc(i.id)}"><span class="id">${esc(i.id)}</span><span class="t">${esc(i.title)}</span>

      <span>${Object.entries(loc).filter(([k]) => k !== g).map(([, v]) => esc(v)).join(' · ')}</span>
      <span>${planned ? `${nm}/${planned} meas.` : nm ? nm + ' meas.' : ''}${np ? ' · ' + np + (np === 1 ? ' photo' : ' photos') : ''}</span></span></button>`;
  }
  view.innerHTML = html;
  $('#q').oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; renderList(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  view.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; renderList(); });
  view.querySelectorAll('[data-item]').forEach(b => b.onclick = () => openItem(b.dataset.item));
  $('#newItem').onclick = newItemSheet;
}

function openItem(id) {
  S.itemId = id; S.tab = 'item'; S.armed = null;
  autoArm();
  render(); window.scrollTo(0, 0);
}
function rowsFor(item) {
  const e = S.res.entries[item.id];
  const ms = e ? e.measurements : [];
  const rows = (item.measurements || []).map(spec => ({ spec, m: ms.find(x => x.key === spec.key) || null, planned: true }));
  for (const m of ms) if (!rows.some(r => r.spec.key === m.key)) rows.push({ spec: { key: m.key, label: m.label, unit: m.unit, from: m.from, to: m.to }, m, planned: false });
  return rows;
}
function hasVal(m) { return m && m.value !== '' && m.value !== null && m.value !== undefined; }
function autoArm() {
  if (!(S.meter.state === 'on' || S.meter.sim)) return;
  const item = itemById(S.itemId); if (!item) return;
  const r = rowsFor(item).find(r => isLen(r.spec.unit) && !hasVal(r.m));
  S.armed = r ? r.spec.key : null;
}

function renderItem() {
  const item = itemById(S.itemId); const p = pkg();
  if (!item) { setTab('list'); return; }

  for (const r of rows) {

      ${s.model_value !== undefined && s.model_value !== null ? `<div class="sub">Model: ${esc(fmtNum(s.model_value, s.unit))} ${UNIT_LABEL[s.unit]}${s.model_status ? ' (' + esc(s.model_status) + ')' : ''}${s.model_source ? ' · ' + esc(s.model_source) : ''}</div>` : ''}

        <button class="ghost" data-clr="${esc(k)}" title="${r.planned ? 'Clear value' : 'Delete measurement'}">✕</button></div>

  view.innerHTML = html;
  loadThumbs();
  camMount();
  $('#camTg').onchange = async ev => { S.settings.camOnReading = ev.target.checked; await saveSettings(); if (!ev.target.checked) camStop(); CAM.err = ''; renderItem(); };

    el.onchange = async () => {

      let v = unit === 'text' ? el.value.trim() : parseNum(el.value);
      if (v === null) { toast('Not a number'); el.value = r.m ? fmtNum(r.m.value, unit) : ''; return; }
      await setMeas(item, r.spec, { value: v, method: r.m?.method === 'laser-ble' && r.m.value === v ? 'laser-ble' : (unit === 'text' || unit === 'pcs' ? 'other' : 'laser-manual'), raw: undefined });

  });
  view.querySelectorAll('[data-last]').forEach(b => b.onclick = async () => { if (!S.last) return; const r = rows.find(x => x.spec.key === b.dataset.last); await applyReading(item, r.spec, S.last); renderItem(); });
  view.querySelectorAll('[data-meth]').forEach(el => el.onchange = async () => { const m = entry(item.id).measurements.find(x => x.key === el.dataset.meth); m.method = el.value; await saveRes(); });
  view.querySelectorAll('[data-stat]').forEach(el => el.onchange = async () => { const m = entry(item.id).measurements.find(x => x.key === el.dataset.stat); m.status = el.value; await saveRes(); });
  view.querySelectorAll('[data-h]').forEach(el => el.onchange = async () => {
    const m = entry(item.id).measurements.find(x => x.key === el.dataset.h); const v = parseNum(el.value);
    if (v === null) { toast('Height must be a number in metres'); return; }

  view.querySelectorAll('[data-st]').forEach(b => b.onclick = async () => { const en = entry(item.id, true); en.state = b.dataset.st; en.updated = nowIso(); await saveRes(); renderItem(); });
  $('#note').onchange = async ev => { const en = entry(item.id, true); en.note = ev.target.value; en.updated = nowIso(); await saveRes(); };
  $('#addM').onclick = () => addMeasSheet(item);
  if ($('#simBtn')) $('#simBtn').onclick = simulate;
  $('#camIn').onchange = ev => addPhotos(item, ev.target.files);
  $('#galIn').onchange = ev => addPhotos(item, ev.target.files);
  view.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => photoSheet(item, b.dataset.ph));
}
function markArmed() {
  view.querySelectorAll('.mrow').forEach(r => { const on = r.dataset.row === S.armed; r.classList.toggle('armed', on); const w = r.querySelector('.waiting'); if (on && !w) r.insertAdjacentHTML('afterbegin', '<span class="waiting">Waiting for laser</span>'); if (!on && w) w.remove(); });
}

async function setMeas(item, spec, patch) {
  const en = entry(item.id, true);
  let m = en.measurements.find(x => x.key === spec.key);
  if (!m) {
    m = { key: spec.key, label: spec.label, unit: spec.unit, value: '', method: 'laser-manual', status: pkg().default_status || 'confirmed', taken: nowIso() };
    if (spec.from) m.from = spec.from; if (spec.to) m.to = spec.to;
    const hd = typeof spec.height_m === 'number' ? spec.height_m : parseNum(S.settings.heightDefault ?? '');
    if (typeof hd === 'number') m.height_m = hd;
    en.measurements.push(m);
  }
  if ('value' in patch && patch.value !== m.value) { m.taken = nowIso(); delete m.photo_id; }
  for (const [k, v] of Object.entries(patch)) { if (v === undefined) delete m[k]; else m[k] = v; }
  if (m.value === '') en.measurements = en.measurements.filter(x => x !== m);
  if (!en.state && en.measurements.length) en.state = 'partial';
  en.updated = nowIso();
  await saveRes();
}
async function applyReading(item, spec, rd) {
  const v = spec.unit === 'mm' ? Math.round(rd.m * 10000) / 10 : Math.round(rd.m * 10000) / 10000;
  await setMeas(item, spec, { value: v, method: rd.sim ? 'other' : 'laser-ble', raw: rd.raw, meter_reference: S.settings.meterRef, note: rd.sim ? 'Simulated reading' : undefined });
}

/* ---------- incoming laser data ---------- */
async function onReading(rd) {
  S.last = rd; renderChip();
  try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
  if (S.tab === 'item' && S.armed) {
    const item = itemById(S.itemId); const rows = rowsFor(item);
    const r = rows.find(x => x.spec.key === S.armed);
    if (r) {
      const shot = CAM.stream ? await camCapture() : null;
      await applyReading(item, r.spec, rd);
      if (shot) await addShot(item, r.spec, rd, shot);
      const i = rows.indexOf(r);
      const nx = rows.slice(i + 1).concat(rows.slice(0, i)).find(x => isLen(x.spec.unit) && !hasVal(x.m) && x.spec.key !== r.spec.key);
      S.armed = nx ? nx.spec.key : null;
      const y = window.scrollY; renderItem(); window.scrollTo(0, y);
      const el = view.querySelector('.mrow.armed'); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      toast(`${fmtNum(rd.m, 'm')} m → ${r.spec.label}`);
      return;
    }
  }
  if (S.tab === 'meter') renderMeter();
  else toast(`${fmtNum(rd.m, 'm')} m – choose a measurement and tap ⤓`);
}

function parseBosch(u8) {
  if (u8.length >= 11 && u8[0] === 0xC0 && u8[1] === 0x55 && u8[2] === 0x10 && u8[3] === 0x06) {
    const m = new DataView(u8.buffer, u8.byteOffset, u8.byteLength).getFloat32(7, true);
    if (Number.isFinite(m) && m > 0 && m < 300) return { m };
  }
  return null;
}
function logLine(s) { S.meter.log.unshift(new Date().toLocaleTimeString('en-GB') + '  ' + s); S.meter.log.length = Math.min(S.meter.log.length, 80); if (S.tab === 'meter') { const l = $('#log'); if (l) l.textContent = S.meter.log.join('\n'); } }
function onFrame(u8, sim) {
  const isHeartbeat = u8.length === 4 && u8[0] === 0xC0 && u8[1] === 0x11;
  if (!isHeartbeat || S.settings.showHeartbeat) logLine((sim ? 'SIM ' : 'RX  ') + hex(u8));
  const p = parseBosch(u8);
  if (p) onReading({ m: p.m, raw: hex(u8), t: Date.now(), sim: !!sim });
}
function simulate() {
  const m = Math.round((0.3 + Math.random() * 7.7) * 10000) / 10000;
  const u8 = new Uint8Array(16); u8.set([0xC0, 0x55, 0x10, 0x06]);
  new DataView(u8.buffer).setFloat32(7, m, true);
  onFrame(u8, true);
}

/* ---------- Bluetooth (Bosch GLM 50-27 C/CG and related) ---------- */
function btProblem() {
  if (!('bluetooth' in navigator)) return 'This browser has no Web Bluetooth. Use Chrome on Android.';
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed) return 'The page is running inside another page (e.g. the preview on claude.ai), where Bluetooth is blocked. Open the app from its own address in Chrome.';
  if (!window.isSecureContext) return 'Bluetooth requires an https address.';
  return '';
}
function setMeter(st) { S.meter.state = st; renderChip(); if (S.tab === 'meter') renderMeter(); }
async function connectMeter(all) {
  const prob = btProblem(); if (prob) { toast(prob); return; }
  try {
    const opts = all ? { acceptAllDevices: true, optionalServices: [BOSCH.svc] } : { filters: [{ services: [BOSCH.svc] }], optionalServices: [BOSCH.svc] };
    const dev = await navigator.bluetooth.requestDevice(opts);
    S.meter.dev = dev; S.meter.want = true;
    dev.addEventListener('gattserverdisconnected', onDisconnected);
    await gattSetup();
  } catch (e) { logLine('Error: ' + e.message); if (S.meter.state !== 'on') setMeter('off'); if (e.name !== 'NotFoundError') toast('Connection failed: ' + e.message); }
}
async function gattSetup() {
  setMeter('connecting');
  const srv = await S.meter.dev.gatt.connect();
  logLine('Connected to ' + (S.meter.dev.name || 'unnamed device'));
  const svc = await srv.getPrimaryService(BOSCH.svc);
  const chr = await svc.getCharacteristic(BOSCH.chr);
  S.meter.chr = chr;
  if (!S.meter.bound.has(chr)) {
    S.meter.bound.add(chr);
    chr.addEventListener('characteristicvaluechanged', ev => { const dv = ev.target.value; onFrame(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength).slice()); });
  }
  await chr.startNotifications();
  await sendSync();
  setMeter('on');
  startKeepAlive();
  if (S.tab === 'item') { autoArm(); renderItem(); }
}
async function sendSync() {
  const chr = S.meter.chr; if (!chr) return;
  const data = new Uint8Array(BOSCH.sync);
  try {
    if (chr.properties.write && chr.writeValueWithResponse) await chr.writeValueWithResponse(data);
    else if (chr.writeValueWithoutResponse) await chr.writeValueWithoutResponse(data);
    else await chr.writeValue(data);
    logLine('TX  ' + hex(data));
  } catch (e) { logLine('Could not send sync: ' + e.message); }
}
function startKeepAlive() {
  clearInterval(S.meter.timer);
  if (S.settings.keepAlive) S.meter.timer = setInterval(() => { if (S.meter.state === 'on') sendSync(); }, 240000);
}
async function onDisconnected() {

/* ---------- photo on reading (phone camera) ---------- */
const CAM = { stream: null, box: null, video: null, ov: null, small: null, timer: null, buf: [], err: '', starting: null };
function camWanted() { return !!S.settings.camOnReading && S.tab === 'item'; }
/* Finds a laser dot: the most saturated green (or red) spot. The core of the dot is often blown out to white,
   so the centroid is computed from the coloured rim around it. Many similar spots (e.g. green paint) = no dot. */
function findLaserSpot(d, w, h, color) {
  const red = color === 'red'; const sc = new Float32Array(w * h); let best = 0, bi = -1;
  for (let i = 0, p = 0; i < w * h; i++, p += 4) {
    const r = d[p], g = d[p + 1], b = d[p + 2];
    const dom = red ? r - Math.max(g, b) : g - Math.max(r, b);
    const v = dom > 0 ? dom * (red ? r : g) / 255 : 0;
    sc[i] = v; if (v > best) { best = v; bi = i; }
  }
  if (best < 40) return null;
  const bx = bi % w, by = (bi / w) | 0, R = Math.max(6, Math.round(w / 40)), lim = best * 0.5;
  let sx = 0, sy = 0, sw = 0, inside = 0, outside = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = sc[y * w + x]; if (v < lim) continue;
    if (Math.abs(x - bx) <= R && Math.abs(y - by) <= R) { sx += x * v; sy += y * v; sw += v; inside++; } else outside++;
  }
  if (outside > inside * 2 + 4) return null;
  return { x: Math.round((sx / sw + 0.5) / w * 10000) / 10000, y: Math.round((sy / sw + 0.5) / h * 10000) / 10000, score: Math.round(best) };
}
function spotIn(src, W, H) {
  const w = 320, h = Math.max(1, Math.round(320 * H / W));
  const c = CAM.small || (CAM.small = document.createElement('canvas'));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(src, 0, 0, w, h);
  return { spot: findLaserSpot(g.getImageData(0, 0, w, h).data, w, h, S.settings.laserColor), w, h };
}
async function camStart() {
  if (CAM.stream) return true;
  if (CAM.starting) return CAM.starting;
  CAM.starting = (async () => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { CAM.err = 'The camera cannot be used in this browser. Use Chrome on the phone and the app\'s own address (https).'; return false; }
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      if (!camWanted()) { st.getTracks().forEach(t => t.stop()); return false; }
      if (!CAM.box) {
        CAM.box = document.createElement('div'); CAM.box.className = 'cam';
        CAM.box.innerHTML = '<video muted playsinline autoplay></video><canvas aria-hidden="true"></canvas><div class="camst" aria-live="polite">Starting camera …</div>';
        CAM.video = CAM.box.querySelector('video'); CAM.ov = CAM.box.querySelector('canvas');
      }
      CAM.stream = st; CAM.err = ''; CAM.buf = [];
      CAM.video.srcObject = st; await CAM.video.play().catch(() => {});

      return true;
    } catch (e) {
      CAM.err = e.name === 'NotAllowedError' ? 'The app has no access to the camera. Allow the camera for this site in Chrome (the lock next to the address) and try again.' : 'The camera could not be started: ' + e.message;
      return false;

}

}
function camMount() {
  const slot = $('#camSlot'); if (!slot) return;
  if (CAM.err) { slot.innerHTML = `<div class="warnbox">${esc(CAM.err)}</div><button class="ghost" id="camRetry">Retry camera</button>`; $('#camRetry').onclick = () => { CAM.err = ''; renderItem(); }; return; }
  if (CAM.box) { slot.appendChild(CAM.box); if (CAM.stream) CAM.video.play().catch(() => {}); }
  if (!CAM.stream) camStart().then(ok => { if (S.tab !== 'item') return; if (ok) camMount(); else if (CAM.err) renderItem(); });
}
function camSample() {
  const v = CAM.video; if (!CAM.stream || !v || !v.videoWidth) return;
  const { spot, w, h } = spotIn(v, v.videoWidth, v.videoHeight);
  const t = Date.now(); CAM.buf.push({ t, spot }); while (CAM.buf.length && CAM.buf[0].t < t - 2500) CAM.buf.shift();
  const o = CAM.ov; if (o.width !== w || o.height !== h) { o.width = w; o.height = h; }
  const og = o.getContext('2d'); og.clearRect(0, 0, w, h);

  const st = CAM.box.querySelector('.camst'); const txt = spot ? '<b>Laser dot found</b> · photo taken on next reading' : 'No laser dot in view · photo taken on next reading';
  if (st.innerHTML !== txt) st.innerHTML = txt;
}
/* Takes the photo the moment the reading arrives. The dot is searched for in the photo itself first;
   if the laser switched off after the reading, the best dot from the last 2 seconds before is used. */
async function camCapture() {
  const v = CAM.video; if (!CAM.stream || !v || !v.videoWidth) return null;
  const vw = v.videoWidth, vh = v.videoHeight, max = S.settings.photoMax || 4096;
  const k = Math.min(1, max / Math.max(vw, vh)), W = Math.round(vw * k), H = Math.round(vh * k);
  const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(v, 0, 0, W, H);

    const prev = CAM.buf.filter(b => b.spot && b.t > t0 - 2000).sort((a, b) => b.spot.score - a.spot.score)[0];

/* ---------- photos ---------- */
async function processPhoto(file) {
  const max = S.settings.photoMax;
  if (!max) return { blob: file, w: 0, h: 0 };
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const W = Math.round(bmp.width * k), H = Math.round(bmp.height * k);
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    c.getContext('2d').drawImage(bmp, 0, 0, W, H); if (bmp.close) bmp.close();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    return blob ? { blob, w: W, h: H } : { blob: file, w: 0, h: 0 };
  } catch (e) { return { blob: file, w: 0, h: 0 }; }
}

  renderItem();
}

      const o = { file, taken: ph.taken }; if (ph.caption) o.caption = ph.caption; if (ph.width) { o.width = ph.width; o.height = ph.height; } if (ph.bytes) o.bytes = ph.bytes; if (ph.original_name) o.original_name = ph.original_name;
      if (ph.source) o.source = ph.source; if (ph.meas_key) o.measurement_key = ph.meas_key; if (ph.spot) o.laser_spot = { x: ph.spot.x, y: ph.spot.y, score: ph.spot.score, from: ph.spot.from }; return o; });
    const ms = e.measurements.filter(hasVal).map(m => { const o = { key: m.key, label: m.label, value: m.value, unit: m.unit, method: m.method, status: m.status, taken: m.taken };
      for (const k of ['from', 'to', 'meter_reference', 'raw', 'note']) if (m[k]) o[k] = m[k]; if (typeof m.height_m === 'number') o.height_m = m.height_m; if (m.photo_id && fileOf[m.photo_id]) o.photo = fileOf[m.photo_id]; return o; });
    const loc = Object.fromEntries(Object.entries(e.locator || {}).filter(([, v]) => v));
    if (!ms.length && !photos.length && !e.note && !e.state && !Object.keys(loc).length && !item.new_item) continue;
    const o = { item_id: item.id, state: e.state || item.state || 'open', measurements: ms, photos };
    if (item.new_item) { o.new_item = true; o.title = item.title; }
    if (e.note) o.note = e.note;
    const fullLoc = Object.assign({}, item.locator || {}, loc); if (Object.keys(fullLoc).length) o.locator = fullLoc;
    o.updated = e.updated || nowIso();
    entries.push(o);
  }
  const r = { format: 'survey-result/1', package_id: p.package_id, object_id: p.object.id, exported: nowIso(), app_version: APP_VERSION, meter: { model: 'Bosch GLM 50-27 CG', reference: S.settings.meterRef }, entries };
  if (p.version) r.package_version = p.version;
  if (S.settings.surveyor) r.surveyor = S.settings.surveyor;
  return { result: r, photoFiles };
}
function csvOf(r) {
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const lines = ['item,measurement,from,to,value,unit,height_m,method,status,taken,photo'];
  for (const e of r.entries) for (const m of e.measurements) lines.push([e.item_id, m.label, m.from || '', m.to || '', m.value, m.unit, typeof m.height_m === 'number' ? m.height_m : '', m.method, m.status, m.taken, m.photo || ''].map(q).join(','));
  return '﻿' + lines.join('\r\n') + '\r\n';
}
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(files) {
  const enc = new TextEncoder(); const parts = [], central = []; let off = 0;
  const d = new Date(); const dt = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1); const dd = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    let data = f.data;
    if (typeof data === 'string') data = enc.encode(data); else if (data instanceof Blob) data = new Uint8Array(await data.arrayBuffer());
    const name = enc.encode(f.name), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true); lh.setUint16(10, dt, true); lh.setUint16(12, dd, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dt, true); ch.setUint16(14, dd, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
    central.push(ch, name);
    off += 30 + name.length + data.length;
  }
  const csize = central.reduce((a, p) => a + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, csize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end], { type: 'application/zip' });
}
async function exportFiles(withPhotos) {
  const p = pkg(); const { result, photoFiles } = buildResult();
  const json = JSON.stringify(result, null, 1);
  if (!withPhotos) return { blob: new Blob([json], { type: 'application/json' }), name: `${safeName(p.package_id)}_result_${stamp()}.json`, result };
  const files = [{ name: 'result.json', data: json }, { name: 'measurements.csv', data: csvOf(result) },
    { name: 'README.txt', data: `Survey result for ${p.object.name} (${p.package_id})\nExported ${new Date().toLocaleString('en-GB')} by app ${APP_VERSION}.\n\nresult.json        all items, measurements and photo details (format survey-result/1)\nmeasurements.csv   the measurements as a table (comma-separated, decimal point)\nphotos/            photos named by item ID. Photos taken at a reading carry the measurement key and the laser dot position (0-1 from the top-left corner) in result.json\n` }];
  for (const pf of photoFiles) { const rec = await dbGet('photos', pf.id); if (rec) files.push({ name: pf.file, data: rec.blob }); }
  return { blob: await makeZip(files), name: `${safeName(p.package_id)}_result_${stamp()}.zip`, result };
}
async function deliver(blob, name, how) {
  if (how === 'share') {
    try {
      const file = new File([blob], name, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
      toast('Sharing is not supported here – saving instead');
    } catch (e) { if (e.name === 'AbortError') return false; }
  }
  if (S.downloads) {
    try { await S.downloads.save({ filename: name, data: blob }); return true; } catch (e) { if (e.code === 'declined') return false; }
  }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); return true;
  } catch (e) { toast('Could not save the file'); return false; }
}
function renderExport() {
  const p = pkg(); const c = counts(); const { result } = buildResult();
  const photoBytes = Object.values(S.res.entries).reduce((a, e) => a + e.photos.reduce((b, ph) => b + (ph.bytes || 0), 0), 0);
  view.innerHTML = `<h2>Export</h2>
  <p class="lead">${esc(p.object.name)} · ${result.entries.length} items with answers · ${c.meas} measurements · ${c.photos} photos (${(photoBytes / 1048576).toFixed(1)} MB)</p>
  <label class="f" for="sv">Surveyed by</label><input id="sv" value="${esc(S.settings.surveyor)}" placeholder="Name or initials">
  <h3 style="margin-top:20px">Data only</h3>
  <p class="note">Small JSON file without photos. Good when data is expensive; photos can be sent later.</p>
  <div class="row"><button class="pri" data-x="json-share">Share …</button><button class="ghost" data-x="json-save">Save file</button><button class="ghost" id="copy">Copy</button></div>
  <h3 style="margin-top:20px">Full package</h3>
  <p class="note">ZIP with result.json, measurements.csv and all photos.</p>
  <div class="row"><button class="pri" data-x="zip-share">Share …</button><button class="ghost" data-x="zip-save">Save file</button></div>
  <h3 style="margin-top:20px">Photo size</h3>
  <select id="pm"><option value="1600"${S.settings.photoMax === 1600 ? ' selected' : ''}>1600 px (smallest)</option><option value="2048"${S.settings.photoMax === 2048 ? ' selected' : ''}>2048 px (default)</option><option value="3072"${S.settings.photoMax === 3072 ? ' selected' : ''}>3072 px</option><option value="0"${S.settings.photoMax === 0 ? ' selected' : ''}>Original (largest files)</option></select>
  <p class="note">Applies to new photos. Original keeps the camera data (e.g. time and camera angle), which can be used for 3D later.</p>
  <h3 style="margin-top:20px">Restore and reset</h3>
  <div class="row"><label class="filebtn">Restore from JSON<input type="file" accept=".json,application/json" id="rest"></label><button class="ghost" id="reset">Reset results</button></div>
  <p class="note">Restore reads measurements, notes and status from an exported JSON file (not photos).</p>`;
  $('#sv').onchange = e => { S.settings.surveyor = e.target.value.trim(); saveSettings(); };
  $('#pm').onchange = e => { S.settings.photoMax = Number(e.target.value); saveSettings(); };
  view.querySelectorAll('[data-x]').forEach(b => b.onclick = async () => {
    const [kind, how] = b.dataset.x.split('-');
    b.disabled = true; try { const f = await exportFiles(kind === 'zip'); const ok = await deliver(f.blob, f.name, how); if (ok) toast('Exported: ' + f.name); } finally { b.disabled = false; }
  });
  $('#copy').onclick = async () => { const { result: r } = buildResult(); try { await navigator.clipboard.writeText(JSON.stringify(r, null, 1)); toast('Copied'); } catch (e) { toast('Copy was refused'); } };
  $('#reset').onclick = () => confirmSheet('Delete all measurements, notes and photos for this package on the phone?', async () => {
    for (const e of Object.values(S.res.entries)) for (const ph of e.photos) await dbDel('photos', ph.id);
    S.res = newResult(p); await saveRes(); renderExport(); toast('Results reset');
  });
  $('#rest').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const r = JSON.parse(await f.text());
      if (r.format !== 'survey-result/1' || r.package_id !== p.package_id) { toast('The file does not belong to the active package'); return; }
      let n = 0;
      for (const e of r.entries) {
        if (e.new_item && !itemById(e.item_id)) S.res.new_items.push({ id: e.item_id, title: e.title || e.item_id, state: 'open', locator: e.locator || {}, measurements: [], new_item: true });
        const en = entry(e.item_id, true);
        en.state = e.state; en.note = e.note || en.note; en.locator = Object.assign(en.locator, e.locator || {});
        for (const m of e.measurements) { en.measurements = en.measurements.filter(x => x.key !== m.key); en.measurements.push(m); }
        n++;
      }
      await saveRes(); toast(n + ' items restored'); renderExport();
    } catch (e) { toast('Could not read the file: ' + e.message); }
  };
}

/* ---------- start ---------- */
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#chip').onclick = () => { if (S.meter.sim && S.meter.state !== 'on' && S.tab === 'item') simulate(); else setTab('meter'); };
$('#chip').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#chip').click(); } };
setInterval(renderChip, 15000);

(async () => {
  for (const el of document.querySelectorAll('script[type="application/json"][data-package]')) {
    try { const p = JSON.parse(el.textContent); S.builtin[p.package_id] = p; S.pkgs[p.package_id] = p; } catch (e) {}
  }
  await idbOpen();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  for (const id of await dbKeys('packages')) { const p = await dbGet('packages', id); if (validPackage(p)) S.pkgs[id] = p; }
  const st = await dbGet('kv', 'settings'); if (st) Object.assign(S.settings, st);
  S.meter.sim = !!(await dbGet('kv', 'sim'));
  const act = await dbGet('kv', 'active');
  if (act && S.pkgs[act]) await activate(act);
  else if (Object.keys(S.pkgs).length) await activate(Object.keys(S.pkgs)[0]);
  else render();
  try { if (window.claude && window.claude.use) S.downloads = await window.claude.use('downloads'); } catch (e) {}
})();

window.__survey = { parseBosch, makeZip, crc32, buildResult, simulate, findLaserSpot, CAM, S };
}
